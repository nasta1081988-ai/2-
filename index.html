<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мемори - Найди пары</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Стартовый экран */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('start.jpg') center center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
        }

        .start-screen.hidden {
            display: none;
        }

        .start-overlay {
            background: rgba(0, 0, 0, 0.5);
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
        }

        .start-overlay h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .start-overlay p {
            color: white;
            font-size: 24px;
            font-weight: 400;
        }

        /* Финальный экран с видео */
        .victory-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
        }

        .victory-screen.show {
            display: flex;
        }

        .victory-screen video {
            max-width: 90%;
            max-height: 80%;
            border-radius: 20px;
        }

        .victory-screen button {
            margin-top: 20px;
            background: #7f27a8;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 18px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .victory-screen button:hover {
            transform: scale(1.05);
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 18px;
            color: #333;
            font-weight: 400;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .card {
            width: 80px;
            height: 80px;
            position: relative;
            cursor: pointer;
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 28px;
            font-weight: bold;
        }

        .card-front {
            background: url('card_back.jpg') center center/cover no-repeat;
            color: white;
        }

        .card-back {
            background: white;
            border: 3px solid #667eea;
            transform: rotateY(180deg);
            overflow: hidden;
        }

        .card-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card.matched .card-back {
            border-color: #4CAF50;
        }

        .btn {
            background: #7f27a8;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            cursor: pointer;
            display: block;
            margin: 0 auto;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .game-board {
                grid-template-columns: repeat(4, 1fr);
            }
            
            .card {
                width: 70px;
                height: 70px;
            }

            .start-overlay h1 {
                font-size: 36px;
            }

            .start-overlay p {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- Стартовый экран -->
    <div class="start-screen" id="startScreen">
        <div class="start-overlay">
            <h1>Мемори</h1>
            <p>Нажмите, чтобы начать игру</p>
        </div>
    </div>

    <!-- Финальный экран с видео -->
    <div class="victory-screen" id="victoryScreen">
        <video id="victoryVideo" controls>
            <source src="victory.mp4" type="video/mp4">
        </video>
        <button onclick="restartGame()">Играть снова</button>
    </div>

    <div class="container">
        <h1>🎮 Мемори - Найди пары</h1>
        <div class="stats">
            <div>Ходы: <span id="moves">0</span></div>
            <div>Пары: <span id="pairs">0</span>/10</div>
        </div>
        <div class="game-board" id="gameBoard"></div>
        <button class="btn" onclick="initGame()">Новая игра</button>
    </div>

    <script>
        let flippedCards = [];
        let moves = 0;
        let pairs = 0;
        let lockBoard = false;

        // Обработчик стартового экрана
        document.getElementById('startScreen').addEventListener('click', function() {
            this.classList.add('hidden');
            initGame();
        });

        function initGame() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            
            moves = 0;
            pairs = 0;
            flippedCards = [];
            lockBoard = false;
            
            document.getElementById('moves').textContent = moves;
            document.getElementById('pairs').textContent = pairs;

            // Создаем массив с картинками (каждая картинка встречается дважды)
            let cards = [];
            for (let i = 1; i <= 10; i++) {
                cards.push(`card${i}.jpg`);
                cards.push(`card${i}.jpg`);
            }

            // Перемешиваем массив
            cards = shuffleArray(cards);

            // Создаем карточки
            cards.forEach((image, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.image = image;
                card.dataset.index = index;
                
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front"></div>
                        <div class="card-back">
                            <img src="${image}" alt="Card">
                        </div>
                    </div>
                `;
                
                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
            });
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function flipCard() {
            if (lockBoard) return;
            if (this.classList.contains('flipped')) return;
            if (this.classList.contains('matched')) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                checkForMatch();
            }
        }

        function checkForMatch() {
            lockBoard = true;
            const [card1, card2] = flippedCards;
            const match = card1.dataset.image === card2.dataset.image;

            if (match) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                pairs++;
                document.getElementById('pairs').textContent = pairs;
                flippedCards = [];
                lockBoard = false;

                if (pairs === 10) {
                    setTimeout(() => {
                        showVictoryScreen();
                    }, 500);
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    lockBoard = false;
                }, 1000);
            }
        }

        function showVictoryScreen() {
            const victoryScreen = document.getElementById('victoryScreen');
            const victoryVideo = document.getElementById('victoryVideo');
            victoryScreen.classList.add('show');
            victoryVideo.play();
        }

        function restartGame() {
            const victoryScreen = document.getElementById('victoryScreen');
            const victoryVideo = document.getElementById('victoryVideo');
            victoryScreen.classList.remove('show');
            victoryVideo.pause();
            victoryVideo.currentTime = 0;
            initGame();
        }
    </script>
</body>
</html>
